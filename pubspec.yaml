name: soundscore
description: "Transform audio into guitar/bass tablature and sheet music in real time."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Audio capture ──────────────────────────────────────────────────────────
  record: ^6.2.0
  permission_handler: ^12.0.1

  # ── State management ───────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.5

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^17.2.1

  # ── Monetization ───────────────────────────────────────────────────────────
  purchases_flutter: ^10.0.1
  google_mobile_ads: ^8.0.0

  # ── Notation rendering (VexFlow / OSMD via WebView) ────────────────────────
  webview_flutter: ^4.8.0

  # ── Local storage ──────────────────────────────────────────────────────────
  # isar + isar_generator added in Phase 4 (requires version pinning with freezed)
  sqflite: ^2.3.3+1       # Simple SQL storage for Phase 1 session data
  path_provider: ^2.1.3
  path: ^1.9.0           # Required by path_provider; imported directly in some files
  shared_preferences: ^2.3.3  # User preferences (theme, instrument, etc.)

  # ── Export ─────────────────────────────────────────────────────────────────
  pdf: ^3.11.1
  share_plus: ^13.0.0

  # ── Firebase ───────────────────────────────────────────────────────────────
  firebase_core: ^4.7.0
  firebase_analytics: ^12.3.0
  firebase_crashlytics: ^5.2.0

  # ── FFI bridge to C++ DSP layer ────────────────────────────────────────────
  ffi: ^2.1.3

  # ── Code-gen annotations ───────────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Code generation
  build_runner: ^2.4.12
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  # isar_generator: ^3.1.0+1  # Re-add in Phase 4 with pinned analyzer version

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/html/

  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
